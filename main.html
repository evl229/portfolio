<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Project Template</title>
    <!-- Link to external CSS stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- Defer attribute ensures JavaScript loads in the background without blocking the UI -->
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <nav class="container">
            <div class="logo">MyBrand</div>
            <ul class="nav-links">
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Welcome to Your New Template</h1>
            <p>A clean, framework-free starting point built with native web standards.</p>
            <button id="action-btn">Click Me!</button>
            <p id="message" class="hidden">🎉 You clicked the button!</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 MyBrand. All rights reserved.</p>
    </footer>

</body>
</html>
